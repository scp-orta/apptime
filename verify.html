<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anahtar Doğrulama</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; background: #fafafa; }
    h1 { color: #5865F2; border-bottom: 2px solid #5865F2; padding-bottom: 8px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 20px 0; }
    label { display: block; font-weight: bold; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; box-sizing: border-box; font-family: monospace; }
    button { background: #5865F2; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 14px; }
    .ok { color: #1e8e3e; font-weight: bold; }
    .bad { color: #c0392b; font-weight: bold; }
    a { color: #5865F2; }
  </style>
</head>
<body>
  <h1>Anahtar Doğrulama</h1>
  <p>Secret key ve web key'inizi girerek doğrulamanın çalıştığını test edin.</p>

  <div class="card">
    <form id="verifyForm">
      <label for="secret">Secret Key</label>
      <input type="text" id="secret" required>

      <label for="web">Web Key</label>
      <input type="text" id="web" required>

      <button type="submit" id="btn">Doğrula</button>
    </form>
    <p id="result"></p>
  </div>

  <p><a href="index.html">Bot oluşturma sayfasına dön</a></p>

  <script>
    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const result = document.getElementById("result");
      const btn = document.getElementById("btn");
      btn.disabled = true;
      result.textContent = "Kontrol ediliyor...";

      try {
        const res = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            secretKey: document.getElementById("secret").value.trim(),
            webKey: document.getElementById("web").value.trim()
          })
        });
        const data = await res.json();

        if (data.valid) {
          result.innerHTML = `<span class="ok">Geçerli.</span> Bot: ${data.name}`;
        } else {
          result.innerHTML = `<span class="bad">Geçersiz anahtar.</span>`;
        }
      } catch {
        result.innerHTML = `<span class="bad">Sunucuya bağlanılamadı.</span>`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
